<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINKAR — بوابة الإدارة</title>
<link rel="icon" href="../shared/img/linkar_mark.png">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view" class="login-wrap">
  <div class="login-hero">
    <div class="chev-deco"></div><div class="chev-deco ghost"></div>
    <div class="logos">
      <img class="logo-img" src="../shared/img/linkar_logo_white.png" alt="LINKAR">
      <span class="sep"></span>
      <img class="logo-img ar" src="../shared/img/linkar_ar_white.png" alt="لينكار">
    </div>
    <h1 data-i18n-html="hero_h1"></h1>
    <p data-i18n="portal_name"></p>
    <div class="tag" data-i18n="tagline"></div>
    <div class="eyebrow">Cars · People · A Better Tomorrow</div>
  </div>
  <div class="login-panel">
    <div class="login-card">
      <div class="portal-chip chip navy" data-i18n="portal_name"></div>
      <h2 data-i18n="login_title"></h2>
      <div class="sub" data-i18n="login_sub"></div>
      <form id="login-form">
        <div class="field"><label data-i18n="username"></label><input type="text" value="admin"></div>
        <div class="field"><label data-i18n="password"></label><input type="password" value="••••••••"></div>
        <button type="submit" class="btn navy block" data-i18n="login_btn"></button>
      </form>
      <button id="demo-login" class="btn gold block mt-2" data-i18n="demo_btn"></button>
      <div class="demo-note" data-i18n="demo_note"></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-view" class="shell hidden">
  <aside class="sidebar">
    <div class="brand-row">
      <img class="logo-img" src="../shared/img/linkar_logo_white.png" alt="LINKAR">
      <div class="sub" data-i18n="portal_name"></div>
    </div>

    <button class="nav-item active" data-section="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="10" rx="2.5" fill="currentColor" opacity=".16" stroke="none"/><rect x="3" y="3" width="8" height="10" rx="2.5"/><rect x="14" y="3" width="7" height="6" rx="2.5"/><rect x="14" y="12" width="7" height="9" rx="2.5" fill="currentColor" opacity=".16" stroke="none"/><rect x="14" y="12" width="7" height="9" rx="2.5"/><rect x="3" y="16" width="8" height="5" rx="2.5"/></svg>
      <span data-i18n="nav_dashboard"></span>
    </button>
    <button class="nav-item" data-section="tables">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3" fill="currentColor" opacity=".14" stroke="none"/><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4.5"/></svg>
      <span data-i18n="nav_tables"></span>
    </button>
    <button class="nav-item" data-section="alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" fill="currentColor" opacity=".16" stroke="none"/><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/><circle cx="17" cy="5.5" r="2.4" fill="currentColor" stroke="none" opacity=".9"/></svg>
      <span data-i18n="nav_alerts"></span>
      <span class="badge" id="alerts-badge">4</span>
    </button>
    <button class="nav-item" data-section="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5" fill="currentColor" opacity=".16" stroke="none"/><circle cx="9" cy="8" r="3.5"/><path d="M3 19.5c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="currentColor" opacity=".16" stroke="none"/><path d="M3 19.5c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16.5 4.8c1.4.7 2.3 2.1 2.3 3.7 0 1.5-.9 2.9-2.3 3.6"/><path d="M21 19.5c0-2.5-1.5-4.6-3.7-5.5"/></svg>
      <span data-i18n="nav_customers"></span>
    </button>
    <button class="nav-item" data-section="providers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10v10.5h15V10" fill="currentColor" opacity=".14" stroke="none"/><path d="M4.5 10v10.5h15V10"/><path d="M3 9.5L4.8 4h14.4L21 9.5c0 1.2-1 2.2-2.25 2.2S16.5 10.7 16.5 9.5c0 1.2-1 2.2-2.25 2.2S12 10.7 12 9.5c0 1.2-1 2.2-2.25 2.2S7.5 10.7 7.5 9.5c0 1.2-1 2.2-2.25 2.2S3 10.7 3 9.5z"/><path d="M9.5 20.5v-5.5h5v5.5"/></svg>
      <span data-i18n="nav_providers"></span>
    </button>
    <button class="nav-item" data-section="finance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12.5" rx="3" fill="currentColor" opacity=".14" stroke="none"/><rect x="2.5" y="6" width="19" height="12.5" rx="3"/><circle cx="12" cy="12.2" r="2.6"/><path d="M6 9.5v5.5M18 9.5v5.5" stroke-width="1.5"/></svg>
      <span data-i18n="nav_finance"></span>
    </button>
    <button class="nav-item" data-section="finreports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M7.5 14.5l3.1-3.1 2.5 2.5 3.9-4.7V16h-9.5z" fill="currentColor" opacity=".2" stroke="none"/><path d="M7.5 14.5l3.1-3.1 2.5 2.5 3.9-4.7"/><circle cx="17" cy="9.2" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="nav_finreports"></span>
    </button>
    <button class="nav-item" data-section="promos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9.5" rx="2" fill="currentColor" opacity=".14" stroke="none"/><path d="M20 11.5v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7"/><rect x="2.5" y="7" width="19" height="4.5" rx="1.6" fill="currentColor" opacity=".16" stroke="none"/><rect x="2.5" y="7" width="19" height="4.5" rx="1.6"/><path d="M12 20.5V7"/><path d="M12 7c-1.8 0-3.8-1.3-3.8-3 0-1.3 1.3-1.6 2.2-1.3C11.8 3.2 12 5.5 12 7zM12 7c1.8 0 3.8-1.3 3.8-3 0-1.3-1.3-1.6-2.2-1.3C12.2 3.2 12 5.5 12 7z"/></svg>
      <span data-i18n="nav_promos"></span>
    </button>

    <div class="spacer"></div>
    <div class="provider-chip">
      <div class="avatar">A</div>
      <div>
        <div style="font-weight:700" data-i18n="admin_user"></div>
        <div style="color:rgba(255,255,255,.5);font-size:.66rem">ops@linkar.sa</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title" data-i18n="nav_dashboard"></div>
        <div class="page-sub" data-i18n="topbar_sub"></div>
      </div>
      <div class="grow"></div>
      <div class="segments" id="period-seg">
        <button data-period="week" data-i18n="week"></button>
        <button data-period="month" class="active" data-i18n="month"></button>
        <button data-period="year" data-i18n="year"></button>
      </div>
      <div class="lang-toggle">
        <button data-lang="ar">ع</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn js-logout" title="Logout">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
      <div class="avatar">A</div>
    </div>

    <div class="content">

      <!-- ========== DASHBOARD ========== -->
      <div class="section active" id="sec-dashboard">
        <div class="grid cols-6" id="kpi-grid"></div>

        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title">
              <span data-i18n="chart_growth"></span>
              <span class="hint end" data-i18n="chart_growth_hint"></span>
            </div>
            <div id="growth-chart"></div>
            <div class="tooltip-legend">
              <span class="li"><span class="dot" style="background:var(--gold)"></span><span data-i18n="lg_bookings"></span></span>
              <span class="li"><span class="dot" style="background:var(--navy)"></span><span data-i18n="lg_commissions"></span></span>
            </div>
          </div>
          <div class="grid" style="grid-template-rows:auto auto">
            <div class="card">
              <div class="card-title" data-i18n="chart_services"></div>
              <div id="service-donut"></div>
            </div>
            <div class="card">
              <div class="card-title" data-i18n="chart_cities"></div>
              <div id="city-bars"></div>
            </div>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-title"><span data-i18n="top_providers"></span><span class="hint end" data-i18n="by_revenue"></span></div>
          <div class="table-wrap">
            <table class="data" id="top-providers">
              <thead><tr>
                <th data-i18n="th_provider"></th><th data-i18n="th_bookings"></th>
                <th data-i18n="th_revenue"></th><th data-i18n="th_rating"></th><th></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== TABLES ========== -->
      <div class="section" id="sec-tables">
        <div class="card">
          <div class="card-title" data-i18n="latest_bookings"></div>
          <div class="table-wrap">
            <table class="data" id="bookings-table">
              <thead><tr>
                <th>#</th><th data-i18n="th_customer"></th><th data-i18n="th_service"></th>
                <th data-i18n="th_provider"></th><th data-i18n="th_city"></th>
                <th data-i18n="th_amount"></th><th data-i18n="status"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title" data-i18n="voucher_log"></div>
            <div class="table-wrap">
              <table class="data" id="voucher-table">
                <thead><tr>
                  <th data-i18n="th_code"></th><th data-i18n="th_provider"></th>
                  <th data-i18n="th_amount"></th><th data-i18n="th_commission"></th><th data-i18n="status"></th>
                </tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="tx_log"></div>
            <div class="table-wrap">
              <table class="data" id="tx-table">
                <thead><tr>
                  <th>#</th><th data-i18n="th_type"></th><th data-i18n="th_ref"></th><th data-i18n="th_amount"></th>
                </tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- ========== ALERTS ========== -->
      <div class="section" id="sec-alerts">
        <div class="grid cols-2">
          <div class="card">
            <div class="card-title"><span data-i18n="pending_apps"></span></div>
            <div id="apps-list"></div>
          </div>
          <div>
            <div class="card">
              <div class="card-title" data-i18n="open_disputes"></div>
              <div id="disputes-list"></div>
            </div>
            <div class="card mt-4" style="border-color:var(--cream-border);background:var(--cream)">
              <div class="card-title" style="color:var(--cream-text)">⚠️ <span data-i18n="offplatform_title"></span></div>
              <p class="small" style="color:var(--cream-text);line-height:1.8" data-i18n="offplatform_body"></p>
              <button class="btn outline sm mt-2" onclick="AL.toast(AL.t('demo_only'))" data-i18n="review_case"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- ========== CUSTOMERS ========== -->
      <div class="section" id="sec-customers">
        <div class="grid cols-4">
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--blue-bg)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5c1.5.6 2.5 2 2.5 3.5s-1 2.9-2.5 3.5"/><path d="M21 20c0-2.6-1.7-4.9-4-5.7"/></svg>
            </span><span data-i18n="cu_total"></span></div>
            <div class="k-value" id="cu-total"></div>
            <div class="k-delta up">▲ 15.2% <span class="muted" data-i18n="this_month"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--cream)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gold-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8L6.6 19.7l1-6L3.2 9.4l6.1-.9z"/></svg>
            </span><span data-i18n="cu_vip"></span></div>
            <div class="k-value" id="cu-vip"></div>
            <div class="k-delta"><span class="muted" data-i18n="cu_vip_sub"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--green-bg)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15.5 9.5c-.8-1-2-1.5-3.5-1.5-2 0-3.5 1-3.5 2.5S10 13 12 13s3.5.8 3.5 2.5-1.5 2.5-3.5 2.5c-1.5 0-2.7-.5-3.5-1.5"/></svg>
            </span><span data-i18n="cu_ltv"></span></div>
            <div class="k-value" id="cu-ltv"></div>
            <div class="k-delta up">▲ 4.1% <span class="muted" data-i18n="this_month"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--purple-bg)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20"/></svg>
            </span><span data-i18n="cu_wallets"></span></div>
            <div class="k-value" id="cu-wallets"></div>
            <div class="k-delta"><span class="muted" data-i18n="cu_wallets_sub"></span></div>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-title">
            <span data-i18n="cu_title"></span>
            <span class="hint" data-i18n="cu_hint"></span>
            <input id="cu-search" data-i18n-ph="search" style="margin-inline-start:auto;border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:.78rem;outline:none;width:220px">
            <button class="btn outline sm" id="cu-export">⬇ <span data-i18n="export_csv"></span></button>
          </div>
          <div class="table-wrap">
            <table class="data" id="cu-table">
              <thead><tr>
                <th data-i18n="th_customer"></th>
                <th data-i18n="th_city"></th>
                <th class="sortable" data-sort="bookings"><span data-i18n="th_bookings"></span> <span class="sort-ic"></span></th>
                <th class="sortable" data-sort="spend"><span data-i18n="cu_spend"></span> <span class="sort-ic"></span></th>
                <th data-i18n="cu_wallet"></th>
                <th class="sortable" data-sort="last"><span data-i18n="cu_last"></span> <span class="sort-ic"></span></th>
                <th data-i18n="status"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== PROVIDERS DIRECTORY ========== -->
      <div class="section" id="sec-providers">
        <div class="card">
          <div class="card-title">
            <span data-i18n="dir_title"></span>
            <input id="dir-search" data-i18n-ph="search" style="margin-inline-start:auto;border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:.78rem;outline:none;width:220px">
          </div>
          <div class="table-wrap">
            <table class="data" id="dir-table">
              <thead><tr>
                <th data-i18n="th_provider"></th><th data-i18n="th_city"></th><th data-i18n="th_service"></th>
                <th data-i18n="th_bookings"></th><th data-i18n="th_rating"></th><th data-i18n="status"></th><th data-i18n="actions"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== FINANCE ========== -->
      <div class="section" id="sec-finance">
        <div class="grid cols-3">
          <div class="card kpi" style="background:var(--navy);border-color:var(--navy)">
            <div class="k-label" style="color:rgba(255,255,255,.6)" data-i18n="f_holding"></div>
            <div class="k-value" style="color:#fff" id="f-holding"></div>
          </div>
          <div class="card kpi">
            <div class="k-label" data-i18n="f_due"></div>
            <div class="k-value" id="f-due"></div>
            <div class="k-delta"><span class="muted" data-i18n="f_due_sub"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label" data-i18n="f_net"></div>
            <div class="k-value" id="f-net"></div>
            <div class="k-delta up">▲ 9.8% <span class="muted" data-i18n="this_month"></span></div>
          </div>
        </div>
        <div class="card mt-4">
          <div class="card-title"><span data-i18n="f_payouts"></span><span class="hint end" data-i18n="f_payouts_hint"></span></div>
          <div class="table-wrap">
            <table class="data" id="payout-table">
              <thead><tr>
                <th data-i18n="th_provider"></th><th data-i18n="th_period"></th>
                <th data-i18n="th_gross"></th><th data-i18n="th_commission"></th><th data-i18n="th_net"></th>
                <th data-i18n="status"></th><th data-i18n="actions"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== FINANCIAL REPORTS ========== -->
      <div class="section" id="sec-finreports">
        <div class="grid cols-4">
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--cream)">📈</span><span data-i18n="fr_gmv"></span></div>
            <div class="k-value" id="fr-gmv"></div>
            <div class="k-delta up">▲ 9.8% <span class="muted" data-i18n="this_month"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--green-bg)">🏦</span><span data-i18n="fr_net"></span></div>
            <div class="k-value" id="fr-net"></div>
            <div class="k-delta up">▲ 11.2% <span class="muted" data-i18n="this_month"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--red-bg)">↩️</span><span data-i18n="fr_refunds"></span></div>
            <div class="k-value" id="fr-refunds"></div>
            <div class="k-delta down">▼ 0.9% <span class="muted" data-i18n="fr_of_gmv"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--blue-bg)">💸</span><span data-i18n="fr_cashback"></span></div>
            <div class="k-value" id="fr-cashback"></div>
            <div class="k-delta"><span class="muted" data-i18n="fr_incl_ref"></span></div>
          </div>
        </div>

        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title"><span data-i18n="fr_gmv_trend"></span><span class="hint end" data-i18n="chart_growth_hint"></span></div>
            <div id="fr-gmv-chart"></div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="fr_target"></div>
            <div id="fr-gauge"></div>
            <div class="divider-h"></div>
            <div class="grid cols-2">
              <div class="stat-pill"><div class="v" id="fr-t-book"></div><div class="l" data-i18n="k_bookings"></div></div>
              <div class="stat-pill"><div class="v" id="fr-t-target"></div><div class="l" data-i18n="k_target"></div></div>
            </div>
          </div>
        </div>

        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title" data-i18n="fr_comm_split"></div>
            <div id="fr-stacked"></div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="fr_pnl"></div>
            <div id="fr-pnl"></div>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-title">
            <span data-i18n="fr_refund_log"></span>
            <button class="btn outline sm end" id="fr-export">⬇ <span data-i18n="export_csv"></span></button>
          </div>
          <div class="table-wrap">
            <table class="data" id="refund-table">
              <thead><tr>
                <th>#</th><th data-i18n="th_booking"></th><th data-i18n="th_customer"></th>
                <th data-i18n="th_reason"></th><th data-i18n="th_amount"></th><th data-i18n="status"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== PROMOS ========== -->
      <div class="section" id="sec-promos">
        <div class="card">
          <div class="card-title">
            <span data-i18n="promo_title"></span>
            <button class="btn gold sm end" id="new-promo-btn">＋ <span data-i18n="promo_new"></span></button>
          </div>
          <div class="table-wrap">
            <table class="data" id="promo-table">
              <thead><tr>
                <th data-i18n="th_code"></th><th data-i18n="th_type"></th>
                <th data-i18n="th_usage"></th><th data-i18n="status"></th><th data-i18n="actions"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title">💸 <span data-i18n="cashback_title"></span></div>
            <div class="field"><label data-i18n="cashback_pct"></label><input type="number" value="5" id="cashback-pct"></div>
            <div class="field"><label data-i18n="cashback_cap"></label><input type="number" value="100" id="cashback-cap"></div>
            <button class="btn navy sm" onclick="AL.toast(AL.t('saved'))" data-i18n="save"></button>
          </div>
          <div class="card">
            <div class="card-title">🤝 <span data-i18n="referral_title"></span></div>
            <div class="field"><label data-i18n="referral_bonus"></label><input type="number" value="50" id="ref-bonus"></div>
            <div class="field"><label data-i18n="referral_friend"></label><input type="number" value="25" id="ref-friend"></div>
            <button class="btn navy sm" onclick="AL.toast(AL.t('saved'))" data-i18n="save"></button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Customer details modal -->
<div class="modal-back" id="cu-modal">
  <div class="modal" id="cu-modal-body"></div>
</div>

<!-- Create promo modal -->
<div class="modal-back" id="promo-modal">
  <div class="modal">
    <h3><span data-i18n="promo_new"></span><button class="x js-close">✕</button></h3>
    <div class="field"><label data-i18n="th_code"></label><input id="pm-code" placeholder="SUMMER20" style="text-transform:uppercase;direction:ltr"></div>
    <div class="field"><label data-i18n="pm_kind"></label>
      <select id="pm-kind">
        <option value="pct" data-i18n="pm_pct"></option>
        <option value="fixed" data-i18n="pm_fixed"></option>
      </select>
    </div>
    <div class="field"><label data-i18n="pm_value"></label><input id="pm-value" type="number" value="20"></div>
    <div class="field"><label data-i18n="pm_cap"></label><input id="pm-cap" type="number" value="1000"></div>
    <button class="btn gold block" id="pm-create" data-i18n="pm_create"></button>
  </div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/app.js"></script>
<script src="portal.js"></script>
</body>
</html>
