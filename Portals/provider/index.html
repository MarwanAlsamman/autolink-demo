<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoLink — بوابة مزود الخدمة</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view" class="login-wrap">
  <div class="login-hero">
    <img class="mascot" src="../shared/img/mascot.png" alt="">
    <h1><span class="brand-logo"><span class="a">Auto</span><span class="l">Link</span></span></h1>
    <p data-i18n="portal_name"></p>
    <div class="tag" data-i18n="tagline"></div>
  </div>
  <div class="login-panel">
    <div class="login-card">
      <div class="portal-chip chip gold" data-i18n="portal_name"></div>
      <h2 data-i18n="login_title"></h2>
      <div class="sub" data-i18n="login_sub"></div>
      <form id="login-form">
        <div class="field">
          <label data-i18n="username"></label>
          <input type="text" value="elite.center">
        </div>
        <div class="field">
          <label data-i18n="password"></label>
          <input type="password" value="••••••••">
        </div>
        <button type="submit" class="btn navy block" data-i18n="login_btn"></button>
      </form>
      <button id="demo-login" class="btn gold block mt-2" data-i18n="demo_btn"></button>
      <div class="demo-note" data-i18n="demo_note"></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-view" class="shell hidden">
  <aside class="sidebar">
    <div class="brand-row">
      <img src="../shared/img/mascot.png" alt="">
      <div>
        <div class="brand-logo"><span class="a">Auto</span><span class="l">Link</span></div>
        <div class="sub" data-i18n="portal_name"></div>
      </div>
    </div>

    <button class="nav-item active" data-section="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="10" rx="2.5" fill="currentColor" opacity=".16" stroke="none"/><rect x="3" y="3" width="8" height="10" rx="2.5"/><rect x="14" y="3" width="7" height="6" rx="2.5"/><rect x="14" y="12" width="7" height="9" rx="2.5" fill="currentColor" opacity=".16" stroke="none"/><rect x="14" y="12" width="7" height="9" rx="2.5"/><rect x="3" y="16" width="8" height="5" rx="2.5"/></svg>
      <span data-i18n="nav_overview"></span>
    </button>
    <button class="nav-item" data-section="vouchers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2.5 2.5 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2.5 2.5 0 0 0 0-6z" fill="currentColor" opacity=".15" stroke="none"/><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2.5 2.5 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2.5 2.5 0 0 0 0-6z"/><path d="M9 12l2.1 2.1 4-4.2"/></svg>
      <span data-i18n="nav_vouchers"></span>
      <span class="badge" id="voucher-badge">6</span>
    </button>
    <button class="nav-item" data-section="reservations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3" fill="currentColor" opacity=".14" stroke="none"/><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><rect x="13.8" y="13.2" width="4.6" height="4.6" rx="1.4" fill="currentColor" stroke="none" opacity=".9"/></svg>
      <span data-i18n="nav_reservations"></span>
      <span class="badge" id="new-res-badge">2</span>
    </button>
    <button class="nav-item" data-section="earnings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.2" rx="7" ry="2.9" fill="currentColor" opacity=".16" stroke="none"/><ellipse cx="12" cy="6.2" rx="7" ry="2.9"/><path d="M5 6.2v5.6c0 1.6 3.1 2.9 7 2.9s7-1.3 7-2.9V6.2"/><path d="M5 11.8v5.6c0 1.6 3.1 2.9 7 2.9s7-1.3 7-2.9v-5.6"/></svg>
      <span data-i18n="nav_earnings"></span>
    </button>
    <button class="nav-item" data-section="analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M7.5 14.5l3.1-3.1 2.5 2.5 3.9-4.7V16h-9.5z" fill="currentColor" opacity=".2" stroke="none"/><path d="M7.5 14.5l3.1-3.1 2.5 2.5 3.9-4.7"/><circle cx="17" cy="9.2" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="nav_analytics"></span>
    </button>
    <button class="nav-item" data-section="branches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10v10.5h15V10" fill="currentColor" opacity=".14" stroke="none"/><path d="M4.5 10v10.5h15V10"/><path d="M3 9.5L4.8 4h14.4L21 9.5c0 1.2-1 2.2-2.25 2.2S16.5 10.7 16.5 9.5c0 1.2-1 2.2-2.25 2.2S12 10.7 12 9.5c0 1.2-1 2.2-2.25 2.2S7.5 10.7 7.5 9.5c0 1.2-1 2.2-2.25 2.2S3 10.7 3 9.5z"/><path d="M9.5 20.5v-5.5h5v5.5"/></svg>
      <span data-i18n="nav_branches"></span>
    </button>
    <button class="nav-item" data-section="staff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7.5" r="3.5" fill="currentColor" opacity=".16" stroke="none"/><circle cx="10" cy="7.5" r="3.5"/><path d="M4 19.5c0-3.3 2.7-6 6-6 1.1 0 2.2.3 3.1.9"/><circle cx="17.3" cy="17.3" r="2.9" fill="currentColor" opacity=".16" stroke="none"/><circle cx="17.3" cy="17.3" r="2.9"/><path d="M17.3 13.2v1.3M17.3 20.1v1.3M21.4 17.3h-1.3M14.5 17.3h-1.3" stroke-width="1.5"/></svg>
      <span data-i18n="nav_staff"></span>
    </button>
    <button class="nav-item" data-section="offers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L11 3.8A2 2 0 0 0 9.6 3.2H5a2 2 0 0 0-2 2v4.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z" fill="currentColor" opacity=".15" stroke="none"/><path d="M20.6 13.4L11 3.8A2 2 0 0 0 9.6 3.2H5a2 2 0 0 0-2 2v4.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"/><circle cx="10.2" cy="10.2" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.2" cy="14.2" r="1.15" fill="currentColor" stroke="none"/><path d="M9.4 15l5.6-5.6" stroke-width="1.5"/></svg>
      <span data-i18n="nav_offers"></span>
    </button>
    <button class="nav-item" data-section="reviews">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.2 5.8.85-4.2 4.1.95 5.7-5.15-2.7-5.15 2.7.95-5.7-4.2-4.1 5.8-.85z" fill="currentColor" opacity=".18" stroke="none"/><path d="M12 3.5l2.6 5.2 5.8.85-4.2 4.1.95 5.7-5.15-2.7-5.15 2.7.95-5.7-4.2-4.1 5.8-.85z"/></svg>
      <span data-i18n="nav_reviews"></span>
    </button>

    <div class="spacer"></div>
    <div class="provider-chip">
      <div class="avatar">ن</div>
      <div>
        <div style="font-weight:700" data-i18n="provider_name"></div>
        <div style="color:rgba(255,255,255,.5);font-size:.66rem">✓ <span data-i18n="verified"></span> · 4.8 ★</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title" data-i18n="nav_overview"></div>
        <div class="page-sub"><span data-i18n="provider_name"></span> · <span data-i18n="city_jeddah"></span></div>
      </div>
      <div class="grow"></div>
      <div class="lang-toggle">
        <button data-lang="ar">ع</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn js-logout" title="Logout">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
      <div class="avatar">ن</div>
    </div>

    <div class="content">

      <!-- ========== OVERVIEW ========== -->
      <div class="section active" id="sec-overview">
        <div class="grid cols-4">
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--blue-bg);color:var(--blue)">📅</span><span data-i18n="k_today"></span></div>
            <div class="k-value" id="k-today"></div>
            <div class="k-delta up">+3 <span class="muted" data-i18n="vs_yesterday"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--green-bg);color:var(--green)">💰</span><span data-i18n="k_month_rev"></span></div>
            <div class="k-value" id="k-rev"></div>
            <div class="k-delta up">+9.2% <span class="muted" data-i18n="after_commission"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--cream);color:var(--gold-text)">⭐</span><span data-i18n="k_rating"></span></div>
            <div class="k-value">4.8 <span class="unit">/ 5</span></div>
            <div class="k-delta"><span class="muted">Google: 4.7 ★</span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--purple-bg);color:var(--purple)">🎫</span><span data-i18n="k_pending_v"></span></div>
            <div class="k-value" id="k-pending"></div>
            <div class="k-delta"><span class="muted" data-i18n="awaiting_validation"></span></div>
          </div>
        </div>

        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title"><span data-i18n="week_chart"></span></div>
            <div id="week-chart"></div>
          </div>
          <div class="card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px">
            <div style="font-size:2rem">🎫</div>
            <div style="font-weight:800" data-i18n="quick_validate"></div>
            <div class="muted small" data-i18n="quick_validate_sub"></div>
            <button class="btn gold" onclick="AL.showSection('vouchers')" data-i18n="go_validate"></button>
          </div>
        </div>
      </div>

      <!-- ========== VOUCHERS ========== -->
      <div class="section" id="sec-vouchers">
        <div class="card" style="max-width:640px;margin:0 auto">
          <div style="text-align:center;padding:8px 0 4px">
            <div style="font-size:2.2rem">🎫</div>
            <h2 style="font-size:1.15rem;margin-top:4px" data-i18n="v_title"></h2>
            <div class="muted small" data-i18n="v_sub"></div>
          </div>
          <div class="flex mt-4" style="gap:8px">
            <input id="v-input" placeholder="AL-XXXX-XXXX" style="flex:1;border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;font-weight:800;font-size:1.05rem;letter-spacing:1px;direction:ltr;text-align:center;text-transform:uppercase;outline:none">
            <button class="btn navy" id="v-check" data-i18n="v_check"></button>
          </div>
          <button class="btn outline block mt-2" id="v-scan">
            📷 <span data-i18n="v_scan"></span>
          </button>
          <div class="muted small mt-2" style="text-align:center" data-i18n="v_try"></div>
          <div id="v-result"></div>
        </div>
      </div>

      <!-- ========== RESERVATIONS ========== -->
      <div class="section" id="sec-reservations">
        <div class="cal-toolbar">
          <div class="segments" id="res-view-seg">
            <button data-view="list" class="active" data-i18n="view_list"></button>
            <button data-view="cal" data-i18n="view_cal"></button>
          </div>
          <span class="hint muted small" data-i18n="res_click_hint"></span>
          <div class="cal-legend" id="cal-legend"></div>
        </div>

        <div id="res-list-view" class="card">
          <div class="card-title">
            <span data-i18n="res_title"></span>
            <span class="hint" data-i18n="res_hint"></span>
          </div>
          <div class="table-wrap">
            <table class="data" id="res-table">
              <thead>
                <tr>
                  <th data-i18n="th_time"></th><th data-i18n="th_customer"></th>
                  <th data-i18n="th_service"></th><th data-i18n="th_branch"></th>
                  <th data-i18n="th_amount"></th><th data-i18n="status"></th><th data-i18n="actions"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="res-cal-view" class="card hidden">
          <div class="card-title">
            <span>📅 <span data-i18n="cal_title"></span></span>
            <span class="hint" data-i18n="cal_hint"></span>
          </div>
          <div class="cal-wrap"><div class="cal-grid" id="calendar"></div></div>
        </div>
      </div>

      <!-- ========== STAFF ========== -->
      <div class="section" id="sec-staff">
        <div class="card">
          <div class="card-title"><span data-i18n="staff_title"></span><span class="hint" data-i18n="staff_hint"></span></div>
          <div id="staff-list"></div>
        </div>
      </div>

      <!-- ========== OFFERS ========== -->
      <div class="section" id="sec-offers">
        <div class="card">
          <div class="card-title">
            <span data-i18n="offers_title"></span>
            <button class="btn gold sm end" id="new-offer-btn">＋ <span data-i18n="offer_new"></span></button>
          </div>
          <div id="offers-list"></div>
        </div>
      </div>

      <!-- ========== EARNINGS ========== -->
      <div class="section" id="sec-earnings">
        <div class="grid cols-3">
          <div class="card kpi" style="background:var(--navy);border-color:var(--navy)">
            <div class="k-label" style="color:rgba(255,255,255,.6)" data-i18n="e_balance"></div>
            <div class="k-value" style="color:#fff" id="e-balance"></div>
            <button class="btn gold sm mt-2" id="e-withdraw" data-i18n="e_withdraw"></button>
          </div>
          <div class="card kpi">
            <div class="k-label" data-i18n="e_pending"></div>
            <div class="k-value" id="e-pending"></div>
            <div class="k-delta"><span class="muted" data-i18n="e_pending_sub"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label" data-i18n="e_commission"></div>
            <div class="k-value">15%</div>
            <div class="k-delta"><span class="muted" data-i18n="e_commission_sub"></span></div>
          </div>
        </div>
        <div class="card mt-4">
          <div class="card-title" data-i18n="e_breakdown"></div>
          <div class="table-wrap">
            <table class="data" id="earn-table">
              <thead>
                <tr>
                  <th data-i18n="th_booking"></th><th data-i18n="th_date"></th>
                  <th data-i18n="th_gross"></th><th data-i18n="th_commission"></th><th data-i18n="th_net"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== ANALYTICS ========== -->
      <div class="section" id="sec-analytics">
        <div class="grid cols-2">
          <div class="card">
            <div class="card-title"><span data-i18n="an_net_trend"></span><span class="hint end" data-i18n="an_8m"></span></div>
            <div id="an-net-chart"></div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="an_by_pkg"></div>
            <div id="an-pkg-donut"></div>
          </div>
        </div>
        <div class="card mt-4">
          <div class="card-title"><span data-i18n="an_heat"></span><span class="hint end" data-i18n="an_heat_hint"></span></div>
          <div id="an-heat"></div>
        </div>
        <div class="card mt-4">
          <div class="card-title">
            <span data-i18n="an_payouts"></span>
            <button class="btn outline sm end" id="an-export">⬇ <span data-i18n="export_csv"></span></button>
          </div>
          <div class="table-wrap">
            <table class="data" id="an-payout-table">
              <thead><tr>
                <th>#</th><th data-i18n="th_period"></th><th data-i18n="th_amount"></th>
                <th data-i18n="th_date"></th><th data-i18n="status"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== BRANCHES & SERVICES ========== -->
      <div class="section" id="sec-branches">
        <div class="grid cols-2">
          <div class="card">
            <div class="card-title" data-i18n="b_title"></div>
            <div id="branches-list"></div>
          </div>
          <div class="card">
            <div class="card-title"><span data-i18n="p_title"></span> <span class="hint" data-i18n="p_hint"></span></div>
            <div id="packages-list"></div>
          </div>
        </div>
      </div>

      <!-- ========== REVIEWS ========== -->
      <div class="section" id="sec-reviews">
        <div id="reviews-list" style="max-width:760px;margin:0 auto"></div>
      </div>

    </div>
  </div>
</div>

<!-- Reservation service modal (details + OTP + start/complete) -->
<div class="modal-back" id="res-modal">
  <div class="modal" id="res-modal-body"></div>
</div>

<!-- New offer modal -->
<div class="modal-back" id="offer-modal">
  <div class="modal">
    <h3><span data-i18n="offer_new"></span><button class="x js-close">✕</button></h3>
    <div class="field"><label data-i18n="offer_name"></label><input id="of-title"></div>
    <div class="field"><label data-i18n="th_service"></label>
      <select id="of-service">
        <option value="tinting">—</option><option value="ppf">—</option>
        <option value="wash">—</option><option value="detailing">—</option>
      </select>
    </div>
    <div class="field"><label data-i18n="offer_discount"></label><input id="of-discount" type="number" value="20"></div>
    <div class="field"><label data-i18n="offer_until"></label><input id="of-until" type="date" value="2026-08-31"></div>
    <button class="btn gold block" id="of-create" data-i18n="offer_create"></button>
  </div>
</div>

<!-- QR scan modal -->
<div class="modal-back" id="scan-modal">
  <div class="modal" style="text-align:center">
    <h3><span data-i18n="scan_title"></span><button class="x js-close">✕</button></h3>
    <div style="background:var(--navy);border-radius:14px;padding:30px;color:rgba(255,255,255,.5)">
      <div style="border:2px dashed rgba(255,255,255,.3);border-radius:12px;padding:34px 10px">
        <div style="font-size:2rem">📷</div>
        <div class="small mt-2" data-i18n="scan_placeholder"></div>
      </div>
    </div>
    <button class="btn gold block mt-4" id="simulate-scan" data-i18n="scan_simulate"></button>
  </div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/app.js"></script>
<script src="portal.js"></script>
</body>
</html>
