<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINKAR — بوابة مندوب المبيعات</title>
<link rel="icon" href="../shared/img/linkar_mark.png">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view" class="login-wrap">
  <div class="login-hero">
    <div class="chev-deco"></div><div class="chev-deco ghost"></div>
    <div class="logos">
      <img class="logo-img" src="../shared/img/linkar_logo_white.png" alt="LINKAR">
      <span class="sep"></span>
      <img class="logo-img ar" src="../shared/img/linkar_ar_white.png" alt="لينكار">
    </div>
    <h1 data-i18n-html="hero_h1"></h1>
    <p data-i18n="portal_name"></p>
    <div class="tag" data-i18n="tagline"></div>
    <div class="eyebrow">Cars · People · A Better Tomorrow</div>
  </div>
  <div class="login-panel">
    <div class="login-card">
      <div class="portal-chip chip blue" data-i18n="portal_name"></div>
      <h2 data-i18n="login_title"></h2>
      <div class="sub" data-i18n="login_sub"></div>
      <form id="login-form">
        <div class="field"><label data-i18n="username"></label><input type="text" value="ahmed.aljabr"></div>
        <div class="field"><label data-i18n="password"></label><input type="password" value="••••••••"></div>
        <button type="submit" class="btn navy block" data-i18n="login_btn"></button>
      </form>
      <button id="demo-login" class="btn gold block mt-2" data-i18n="demo_btn"></button>
      <div class="demo-note" data-i18n="demo_note"></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-view" class="shell hidden">
  <aside class="sidebar">
    <div class="brand-row">
      <img class="logo-img" src="../shared/img/linkar_logo_white.png" alt="LINKAR">
      <div class="sub" data-i18n="portal_name"></div>
    </div>

    <button class="nav-item active" data-section="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5" fill="currentColor" opacity=".15" stroke="none"/><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span data-i18n="nav_home"></span>
    </button>
    <button class="nav-item" data-section="newlead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5" fill="currentColor" opacity=".16" stroke="none"/><circle cx="10" cy="8" r="3.5"/><path d="M4 20c0-3.3 2.7-6 6-6 1.4 0 2.7.5 3.7 1.3"/><path d="M18 14.5v6M15 17.5h6" stroke-width="2"/></svg>
      <span data-i18n="nav_newlead"></span>
    </button>
    <button class="nav-item" data-section="leads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5" fill="currentColor" opacity=".16" stroke="none"/><circle cx="9" cy="8" r="3.5"/><path d="M3 19.5c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="currentColor" opacity=".16" stroke="none"/><path d="M3 19.5c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16.5 4.8c1.4.7 2.3 2.1 2.3 3.7 0 1.5-.9 2.9-2.3 3.6"/><path d="M21 19.5c0-2.5-1.5-4.6-3.7-5.5"/></svg>
      <span data-i18n="nav_leads"></span>
      <span class="badge" id="leads-badge"></span>
    </button>
    <button class="nav-item" data-section="mycode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor" opacity=".16" stroke="none"/><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="5.5" y="5.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="15.5" y="5.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="5.5" y="15.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/><path d="M13.5 13.5h3v3h-3zM18 13.5h3M21 16.5h-3M13.5 19.5h3M18 18v3" stroke-width="1.6"/></svg>
      <span data-i18n="nav_mycode"></span>
    </button>
    <button class="nav-item" data-section="commissions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="currentColor" opacity=".15" stroke="none"/><path d="M4 8h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 8V6.5A1.5 1.5 0 0 1 5.5 5H17"/><circle cx="15.8" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="nav_commissions"></span>
    </button>
    <button class="nav-item" data-section="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" fill="currentColor" opacity=".1" stroke="none"/><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="nav_goals"></span>
    </button>
    <button class="nav-item" data-section="prices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L11 3.8A2 2 0 0 0 9.6 3.2H5a2 2 0 0 0-2 2v4.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z" fill="currentColor" opacity=".15" stroke="none"/><path d="M20.6 13.4L11 3.8A2 2 0 0 0 9.6 3.2H5a2 2 0 0 0-2 2v4.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"/><circle cx="7.8" cy="7.8" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="nav_prices"></span>
    </button>
    <button class="nav-item" data-section="leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v6a5 5 0 0 1-10 0z" fill="currentColor" opacity=".16" stroke="none"/><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4.2a2 2 0 0 0 1.9 4H7M17 6h2.8a2 2 0 0 1-1.9 4H17"/><path d="M8.5 21h7M12 15v6"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="nav_leaderboard"></span>
    </button>

    <div class="spacer"></div>
    <div class="provider-chip">
      <div class="avatar">أ</div>
      <div>
        <div style="font-weight:700" data-i18n="rep_name"></div>
        <div style="color:rgba(255,255,255,.5);font-size:.66rem" data-i18n="rep_agency"></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title" data-i18n="nav_home"></div>
        <div class="page-sub"><span data-i18n="rep_agency"></span> · <span class="cell-num">AHM-4419</span></div>
      </div>
      <div class="grow"></div>
      <div class="lang-toggle">
        <button data-lang="ar">ع</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn js-logout" title="Logout">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
      <div class="avatar">أ</div>
    </div>

    <div class="content">

      <!-- ========== HOME ========== -->
      <div class="section active" id="sec-home">
        <div class="card" style="background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;display:flex;align-items:center;gap:18px;flex-wrap:wrap">
          <img src="../shared/img/linkar_mark.png" style="width:58px;height:58px" alt="">
          <div style="flex:1;min-width:200px">
            <div style="font-size:1.1rem;font-weight:800"><span data-i18n="welcome"></span> <span data-i18n="rep_name"></span> 👋</div>
            <div style="color:rgba(255,255,255,.6);font-size:.8rem" data-i18n="welcome_sub"></div>
          </div>
          <button class="btn gold" onclick="AL.showSection('newlead')" data-i18n="cta_newlead"></button>
        </div>

        <div class="grid cols-4 mt-4">
          <div class="card kpi" style="background:var(--navy);border-color:var(--navy)">
            <div class="k-label" style="color:rgba(255,255,255,.6)" data-i18n="w_total"></div>
            <div class="k-value" style="color:#fff" id="w-total"></div>
            <div class="k-delta"><span style="color:var(--gold);font-weight:700" id="w-avail"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--green-bg)">✅</span><span data-i18n="s_sold"></span></div>
            <div class="k-value" id="s-sold"></div>
            <div class="k-delta up">+4 <span class="muted" data-i18n="this_month"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--cream)">📞</span><span data-i18n="s_followup"></span></div>
            <div class="k-value" id="s-follow"></div>
            <div class="k-delta"><span class="muted" data-i18n="in_pipeline"></span></div>
          </div>
          <div class="card kpi">
            <div class="k-label"><span class="k-icon" style="background:var(--blue-bg)">👥</span><span data-i18n="s_customers"></span></div>
            <div class="k-value" id="s-cust"></div>
            <div class="k-delta up">+11 <span class="muted" data-i18n="this_month"></span></div>
          </div>
        </div>

        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title" data-i18n="chart_comm"></div>
            <div id="comm-chart"></div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="chart_services"></div>
            <div id="service-donut"></div>
          </div>
        </div>
      </div>

      <!-- ========== NEW LEAD ========== -->
      <div class="section" id="sec-newlead">
        <div id="lead-form-wrap" class="card" style="max-width:760px;margin:0 auto">
          <div class="card-title">🚗 <span data-i18n="nl_title"></span><span class="hint end" data-i18n="nl_hint"></span></div>

          <div style="font-weight:800;font-size:.8rem;color:var(--gold-text);margin:6px 0 10px" data-i18n="nl_owner"></div>
          <div class="grid cols-2">
            <div class="field"><label><span data-i18n="f_name"></span> <span class="req">*</span></label><input id="f-name"></div>
            <div class="field"><label><span data-i18n="f_phone"></span> <span class="req">*</span></label><input id="f-phone" placeholder="05xxxxxxxx" style="direction:ltr"></div>
            <div class="field"><label data-i18n="f_email"></label><input id="f-email" type="email" style="direction:ltr"></div>
            <div class="field"><label data-i18n="f_city"></label>
              <select id="f-city">
                <option value="jeddah" data-i18n="city_jeddah"></option>
                <option value="riyadh" data-i18n="city_riyadh"></option>
              </select>
            </div>
          </div>

          <div style="font-weight:800;font-size:.8rem;color:var(--gold-text);margin:6px 0 10px" data-i18n="nl_car"></div>
          <div class="grid cols-2">
            <div class="field"><label data-i18n="f_make"></label><select id="f-make"></select></div>
            <div class="field"><label data-i18n="f_model"></label><input id="f-model" placeholder="LX600"></div>
            <div class="field"><label data-i18n="f_year"></label>
              <select id="f-year"><option>2026</option><option>2025</option><option selected>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option></select>
            </div>
            <div class="field"><label data-i18n="f_color"></label><input id="f-color"></div>
            <div class="field"><label data-i18n="f_plate"></label><input id="f-plate" placeholder="ح ن د 8 4 9 1" ></div>
          </div>

          <div style="font-weight:800;font-size:.8rem;color:var(--gold-text);margin:6px 0 10px" data-i18n="nl_services"></div>
          <div class="check-chips" id="f-services"></div>

          <div class="field mt-4"><label data-i18n="f_notes"></label><textarea id="f-notes" rows="3"></textarea></div>

          <div class="field">
            <label data-i18n="f_files"></label>
            <div class="dropzone" id="dropzone">
              📎 <span data-i18n="dz_text"></span>
              <div class="files" id="dz-files"></div>
              <input type="file" id="dz-input" multiple class="hidden">
            </div>
          </div>

          <button class="btn gold block" id="lead-submit" data-i18n="nl_submit"></button>
        </div>

        <!-- success screen -->
        <div id="lead-success" class="card hidden" style="max-width:560px;margin:0 auto;text-align:center;padding:36px 26px">
          <div style="width:74px;height:74px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center;margin:0 auto;font-size:2rem">✅</div>
          <h2 style="margin-top:14px;font-size:1.2rem" data-i18n="ok_title"></h2>
          <p class="muted small mt-2" data-i18n="ok_sub"></p>
          <div class="code-box mt-4" id="ok-code">AL-0000-0000</div>
          <div class="flex mt-4" style="justify-content:center;gap:10px">
            <button class="btn outline" id="ok-copy" data-i18n="copy"></button>
            <button class="btn navy" onclick="AL.showSection('leads')" data-i18n="ok_goleads"></button>
            <button class="btn gold" id="ok-again" data-i18n="ok_again"></button>
          </div>
        </div>
      </div>

      <!-- ========== MY LEADS ========== -->
      <div class="section" id="sec-leads">
        <div class="card">
          <div class="card-title"><span data-i18n="ml_title"></span><span class="hint end" data-i18n="ml_hint"></span></div>
          <div class="table-wrap">
            <table class="data" id="leads-table">
              <thead><tr>
                <th data-i18n="th_code"></th><th data-i18n="th_customer"></th><th data-i18n="th_car"></th>
                <th data-i18n="th_services"></th><th data-i18n="th_date"></th><th data-i18n="status"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== MY CODE ========== -->
      <div class="section" id="sec-mycode">
        <div class="card" style="max-width:440px;margin:0 auto;text-align:center;padding:30px">
          <div class="card-title" style="justify-content:center" data-i18n="mc_title"></div>
          <p class="muted small" data-i18n="mc_sub"></p>
          <div class="qr-ph"></div>
          <div class="code-box" id="my-code">AHM-4419</div>
          <button class="btn navy block mt-4" id="mc-copy" data-i18n="mc_copy"></button>
        </div>
      </div>

      <!-- ========== COMMISSIONS ========== -->
      <div class="section" id="sec-commissions">
        <div class="grid cols-2">
          <div class="card kpi" style="background:var(--navy);border-color:var(--navy)">
            <div class="k-label" style="color:rgba(255,255,255,.6)" data-i18n="w_total"></div>
            <div class="k-value" style="color:#fff" id="c-total"></div>
          </div>
          <div class="card kpi">
            <div class="k-label" data-i18n="w_avail"></div>
            <div class="k-value" id="c-avail"></div>
            <button class="btn gold sm mt-2" id="c-withdraw" data-i18n="withdraw"></button>
          </div>
        </div>
        <div class="card mt-4">
          <div class="card-title">
            <span data-i18n="c_history"></span>
            <button class="btn outline sm end" id="c-export">⬇ <span data-i18n="export_csv"></span></button>
          </div>
          <div class="table-wrap">
            <table class="data" id="comm-table">
              <thead><tr>
                <th>#</th><th data-i18n="th_desc"></th><th data-i18n="th_lead"></th>
                <th data-i18n="th_date"></th><th data-i18n="th_amount"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== GOALS & FUNNEL ========== -->
      <div class="section" id="sec-goals">
        <div class="grid cols-2">
          <div class="card" style="text-align:center">
            <div class="card-title" style="justify-content:center" data-i18n="g_title"></div>
            <div id="g-gauge"></div>
            <div class="muted small mt-2" id="g-remaining"></div>
            <div class="divider-h"></div>
            <div class="grid cols-3" id="g-tiers"></div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="g_funnel"></div>
            <div id="g-funnel"></div>
          </div>
        </div>
        <div class="grid cols-2 mt-4">
          <div class="card">
            <div class="card-title" data-i18n="g_cum"></div>
            <div id="g-cum-chart"></div>
          </div>
          <div class="card">
            <div class="card-title">🏦 <span data-i18n="g_bank"></span></div>
            <div class="kv"><span class="k" data-i18n="g_bank_name"></span><span class="v" id="g-bank-name"></span></div>
            <div class="kv"><span class="k">IBAN</span><span class="v cell-num" id="g-iban" style="letter-spacing:.5px"></span></div>
            <div class="kv"><span class="k" data-i18n="g_holder"></span><span class="v" id="g-holder"></span></div>
            <button class="btn outline sm mt-4" id="g-copy-iban" data-i18n="copy"></button>
            <button class="btn navy sm mt-4" onclick="AL.toast(AL.t('demo_only'))" data-i18n="g_edit_bank"></button>
          </div>
        </div>
      </div>

      <!-- ========== PRICE LIST ========== -->
      <div class="section" id="sec-prices">
        <div class="card">
          <div class="card-title"><span data-i18n="pl_title"></span><span class="hint end" data-i18n="pl_hint"></span></div>
          <div class="table-wrap">
            <table class="data" id="price-table">
              <thead><tr>
                <th data-i18n="th_service_cat"></th><th data-i18n="th_package"></th>
                <th data-i18n="th_from"></th><th data-i18n="th_your_comm"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========== LEADERBOARD ========== -->
      <div class="section" id="sec-leaderboard">
        <div class="card">
          <div class="card-title">🏆 <span data-i18n="lb_title"></span><span class="hint end" data-i18n="lb_hint"></span></div>
          <div id="lb-list"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Lead details modal -->
<div class="modal-back" id="lead-modal">
  <div class="modal wide" id="lead-modal-body"></div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/app.js"></script>
<script src="portal.js"></script>
</body>
</html>
